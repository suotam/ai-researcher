# Topic priorities used by the relevance scorer.
#
# Keyword matching is case-insensitive substring matching against
# title + summary. "high" keywords score more than "medium" ones,
# "entities" capture companies/organisations we track, "negative"
# keywords penalise noise (clickbait, listicles, promos).
#
# importance: per-category multiplier applied to the final score (1.0 = neutral).

ai:
  importance: 1.0
  entities:
    - OpenAI
    - Anthropic
    - Claude
    - Google
    - DeepMind
    - Gemini
    - Meta
    - Llama
    - xAI
    - Grok
    - Microsoft
    - NVIDIA
    - AMD
    - Amazon
    - AWS
    - Mistral
    - Hugging Face
