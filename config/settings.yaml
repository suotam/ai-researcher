# Global settings for the AI Researcher.

llm:
  base_url: http://127.0.0.1:8080   # local llama.cpp server only, never 0.0.0.0
  # Model names = section names in config/llama-models.ini (llama-server runs
  # in router mode and loads the requested model on demand, one at a time).
  #   muse-glimmer-30b  ~4 tok/s on the RTX 5060 (only part fits in VRAM) — best judgment
  #   gemma-4-26b-a4b   ~35 tok/s (MoE, experts mostly in RAM)              — fast
  # Two-stage synthesis: fast_model extracts per-article "story notes"
  # (facts, numbers, quotes) and reranks; model writes the analytical layer
  # over those notes. If model fails, fast_model writes the analysis too.
  model: muse-glimmer-30b           # analysis (Executive Summary, themes, deep dive), weekly digest
  fast_model: gemma-4-26b-a4b       # rerank + story notes + fallback; omit -> same as model
  timeout_seconds: 3600             # Glimmer @ ~4 tok/s with reasoning needs headroom;
                                    # a fast model simply finishes early
  max_retries: 0                    # a retry after a timeout only doubles the wait
  temperature: 0.4
  max_tokens: 4096                  # analysis is 500-800 words + reasoning; prompt +
                                    # max_tokens must fit into the server's -c context
  reasoning_effort: low             # forwarded to llama.cpp; used by templates that support it.
                                    # Glimmer's template wants reasoning_strength instead —
                                    # that is set per model in config/llama-models.ini

collection:
  http_timeout_seconds: 20
  max_items_per_source: 40          # hard cap per feed per run
  lookback_hours: 24
  fetch_fulltext: true              # fetch article pages for the final selection
  fulltext_max_chars: 4000                # default window for --hours

dedup:
  fuzzy_title_threshold: 88         # rapidfuzz token_sort_ratio, 0-100
  fuzzy_window_days: 7              # compare titles against articles from last N days

ranking:
  top_items: 10                     # how many articles are sent to the LLM
  min_score: 25                     # articles below this never reach the brief
  max_per_category: 8               # avoid one category flooding the brief
  llm_rerank: true                  # second-layer ranking via one cheap LLM call
  rerank_pool: 30                   # how many candidates the rerank call sees

briefing:
  output_dir: output
  language: en                      # language of the generated brief (en / cs)
  story_notes: true                 # stage 1: per-article notes by fast_model (facts layer)
  notes_max_tokens: 600
  chat_pack: true                   # also write YYYY-MM-DD-chat-pack.md — the brief with a
                                    # preamble, ready to paste into ChatGPT/Claude to discuss
  learning_topic_cooldown_days: 14  # don't reuse a learning topic within N days
  calendar_horizon_days: 7          # config/calendar.yaml events within N days go to Watchlist
  weekly_top_items: 15              # articles fed into the --weekly digest

logging:
  level: INFO
  file: logs/researcher.log
