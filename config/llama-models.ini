; Model presets for llama-server in router mode.
;
; Each section is one model the Researcher can address by name (the value
; sent as "model" in the API request). Keys are llama-server CLI options
; without leading dashes. The section [*] applies to every model.
;
; The server keeps at most --models-max models loaded (scripts use 1: the
; RTX 5060 has 8 GB VRAM, so models are swapped in and out on demand).
;
; Which model is used for which stage is set in config/settings.yaml
; (llm.synthesis_model / llm.rerank_model).

[*]
c = 16384
np = 1
jinja = true
flash-attn = on
no-mmproj = true

; --- Muse Glimmer 30B (Meta) --------------------------------------------
; Dense 28B, 16.8 GB — only ~40 % fits into 8 GB VRAM, the rest runs on the
; CPU (~3-4 tok/s). Highest quality, slow. Reasoning strength defaults to
; "high" in its chat template; "low" cuts the thinking tokens dramatically.
; n-gpu-layers stays on "auto" (--fit): forcing 99 spills layers into
; shared system memory over PCIe and drops generation to ~0.1 tok/s.
[muse-glimmer-30b]
model = C:\Users\PC\.cache\huggingface\hub\models--meta-models--Muse-Glimmer-30B-GGUF\snapshots\43c7eadd41352a299ea8e0a36b3157978dd63596\Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
chat-template-kwargs = {"reasoning_strength":"low"}
temp = 1.0
top-p = 0.95
top-k = 64
; (Tested 2026-08-15: Meta's DFlash drafter makes it *slower* here — 1.8 tok/s,
; only 18 % of drafts accepted — because the drafter eats VRAM the main model
; needs. Not worth it on 8 GB.)

; --- Gemma 4 26B-A4B (Google) --------------------------------------------
; Mixture-of-Experts: 26B total, ~4B active per token. Expert weights of the
; first 26 layers stay in system RAM, the remaining ones plus all attention/
; dense layers sit on the GPU (~6.8 GB VRAM). Measured 2026-08-15: 35 tok/s
; decode (cpu-moe for all layers: 30 tok/s; 25 layers: VRAM full, slower).
; Thinking is off (enable_thinking=false): the rerank/summary tasks do not
; need it and it would burn tokens.
[gemma-4-26b-a4b]
model = C:\Users\PC\.cache\huggingface\hub\models--unsloth--gemma-4-26B-A4B-it-GGUF\snapshots\c099eb48e663fd284577b04978a94ffccb261841\gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
n-cpu-moe = 26
chat-template-kwargs = {"enable_thinking":false}
temp = 1.0
top-p = 0.95
top-k = 64
